plugins { id 'com.android.application' }

def androidFirebaseAppId = System.getenv('FIREBASE_ANDROID_APP_ID') ?: '1:122122220091:web:e682584aa61c3fdd00221e'
android {
    namespace 'com.diemdev.alertacontato'
    compileSdk 35
    defaultConfig {
        applicationId 'com.diemdev.alertacontato'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'FIREBASE_ANDROID_APP_ID', '"' + androidFirebaseAppId + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
